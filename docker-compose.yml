services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gridmind
      POSTGRES_PASSWORD: gridmind
      POSTGRES_DB: gridmind
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridmind -d gridmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://gridmind:gridmind@postgres:5432/gridmind
      REDIS_URL: redis://redis:6379/0
      GRIDMIND_ENV: development
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m gridmind.workers.runner
    environment:
      DATABASE_URL: postgresql+asyncpg://gridmind:gridmind@postgres:5432/gridmind
      REDIS_URL: redis://redis:6379/0
      GRIDMIND_ENV: development
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
